version: '3.8'

services:
  postgres-jdbc:
    image: postgres:15
    container_name: postgres_jdbc
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: virtual_threads_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pg_jdbc_data:/var/lib/postgresql/data

volumes:
  pg_jdbc_data:
